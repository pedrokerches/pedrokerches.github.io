<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login — Painel Administrativo</title>
  <style>
    :root {
      color-scheme: dark;
      --gold: #d4af37;
      --bg: #050505;
      --panel: #111;
      --line: #2d2d2d;
      --text: #f5f5f5;
      --muted: #bdbdbd;
      --danger: #ff5a5a;
      --success: #77d67a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .card {
      width: min(92vw, 420px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 28px 22px;
      box-shadow: 0 18px 40px rgba(0,0,0,.28);
    }

    .logo {
      font-size: 2rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
      letter-spacing: .04em;
      color: var(--gold);
    }

    .logo span { color: #fff; }

    h1 {
      text-align: center;
      font-size: clamp(1.4rem, 2vw, 2rem);
      margin: 0 0 22px;
      letter-spacing: .06em;
      color: var(--gold);
    }

    form {
      display: grid;
      gap: 10px;
    }

    label {
      font-size: .9rem;
      color: var(--muted);
      font-weight: 600;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      border: 1px solid var(--line);
      background: #0d0d0d;
      color: var(--text);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 1rem;
      outline: none;
    }

    input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(212,175,55,.15);
    }

    .password-wrap {
      position: relative;
    }

    .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: .78rem;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
      background: rgba(0,0,0,.18);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 10px;
    }

    .toggle-password input {
      accent-color: var(--gold);
      width: 14px;
      height: 14px;
      margin: 0;
    }

    button {
      margin-top: 10px;
      border: none;
      background: linear-gradient(135deg, var(--gold), #b89321);
      color: var(--bg);
      font-weight: 800;
      letter-spacing: .08em;
      border-radius: 10px;
      padding: 14px 18px;
      cursor: pointer;
      transition: transform .15s ease, filter .15s ease;
    }

    button:hover {
      filter: brightness(1.05);
      transform: translateY(-1px);
    }

    #message {
      min-height: 22px;
      margin: 6px 0 0;
      font-size: .9rem;
      color: var(--muted);
    }

    #message.error { color: var(--danger); }
    #message.success { color: var(--success); }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">Sites <span>Makers</span></div>
    <h1>PAINEL ADMINISTRATIVO</h1>

    <form id="loginForm" novalidate>
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="email" required>

      <label for="password">Senha</label>
      <div class="password-wrap">
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <label class="toggle-password" for="showPassword">
          <input id="showPassword" type="checkbox" aria-label="Mostrar senha">
          <span>Mostrar</span>
        </label>
      </div>

      <button id="submit" type="submit">ENTRAR</button>
      <p id="message" aria-live="polite"></p>
    </form>
  </main>

  <script>
    'use strict';
    const form = document.querySelector('#loginForm');
    const message = document.querySelector('#message');
    const button = document.querySelector('#submit');
    const passwordInput = document.querySelector('#password');
    const showPassword = document.querySelector('#showPassword');

    const setMessage = (text, type = '') => {
      message.textContent = text;
      message.className = type;
    };

    showPassword.addEventListener('change', () => {
      const visible = showPassword.checked;
      passwordInput.type = visible ? 'text' : 'password';
      passwordInput.setAttribute('aria-label', visible ? 'Senha visível' : 'Senha');
    });

    (async () => {
      try {
        const r = await fetch('/api/auth/session', { credentials: 'same-origin' });
        if (r.ok) location.replace('/admin/');
      } catch (error) {
        // Silently ignore if the session API is unavailable.
      }
    })();

    form.addEventListener('submit', async event => {
      event.preventDefault();
      setMessage('');

      const email = form.email.value.trim();
      const password = form.password.value;

      if (!email || !password) {
        setMessage('Preencha e-mail e senha.', 'error');
        return;
      }

      button.disabled = true;
      button.textContent = 'ENTRANDO...';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const result = await response.json().catch(() => ({}));

        if (!response.ok) {
          setMessage(result.error || 'E-mail ou senha incorretos.', 'error');
          return;
        }

        setMessage('Login realizado com sucesso!', 'success');
        location.replace('/admin/');
      } catch (error) {
        setMessage('Não foi possível autenticar. Tente novamente.', 'error');
      } finally {
        button.disabled = false;
        button.textContent = 'ENTRAR';
      }
    });
  </script>
</body>
</html>
